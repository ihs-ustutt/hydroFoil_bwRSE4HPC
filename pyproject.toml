[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "hydrofoil-opt"
version = "0.1.0"
description = "Hydrofoil case plugin for hydroflow-opt"
readme = "README.md"
authors = [
  {name = "Simon Eyeselein", email = "simon.eyselein@ihs.uni-stuttgart.de"},
  {name = "Thomas Isensee", email = "thomas.isensee@iwr.uni-heidelberg.de"},
]
requires-python = ">=3.11,<3.14"
dependencies = [
  "foamlib",
  "hydroflow-opt",
  "numpy",
  "oslo.concurrency",
  "scikit-learn"
  ]

[project.entry-points."hydroflow_opt.cases"]
hydrofoil = "hydrofoil_opt.case:HydrofoilCase"

[project.scripts]
hydrofoil-opt = "hydrofoil_opt.cli:main"
hydrofoil-opt-worker = "hydrofoil_opt.worker:main"

[tool.hatch.build.targets.wheel]
packages = ["src/hydrofoil_opt"]

[tool.hatch.build.targets.wheel.force-include]
"hydroFoil.py" = "hydrofoil_opt/_legacy/hydroFoil.py"
"utils.py" = "hydrofoil_opt/_legacy/utils.py"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 79
target-version = "py311"
exclude = ["hydroFoil.py", "utils.py"]

[tool.ruff.lint]
select = ["E", "F", "I"]
