[run]
directory = "runs/hydrofoil_baseline_smoke_slurm"
scratch_directory = "runs/hydrofoil_baseline_smoke_slurm/scratch"

[case]
name = "hydrofoil"

[execution]
backend = "slurm"

[resources]
available_cpus = 8
concurrent_evaluations = 4
mpi_ranks = 2
threads_per_rank = 1

[optimization]
islands = 4
population_size = 8
generations = 1
differential_weight = 0.8
crossover_rate = 0.9
topology = "fully_connected"
seed = 20260728
initial_population_file = "../start_db.json"
migrant_handling = "evict"
